version: 2

sources:
  - name: marts
    database: economic-pulse
    schema: marts
    tables:
      - name: fct_sentiment_lag_analysis
        description: >
          Cross-correlation and Granger causality of UMCSENT against UNRATE/GDP at each
          tested lag, written by analyze/lead_lag_analysis.py (not a dbt model).
        config:
          loaded_at_field: computed_at
          freshness:
            warn_after: { count: 40, period: day }
            error_after: { count: 100, period: day }
        columns:
          - name: target_indicator
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["UNRATE", "GDP"]
          - name: lag_months
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 3, 6, 12]
                    quote: false
          - name: cross_correlation
            tests:
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: -1
                    max_value: 1
          - name: granger_p_value
            tests:
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    max_value: 1
          - name: strongest_lag_flag
            tests:
              - not_null
