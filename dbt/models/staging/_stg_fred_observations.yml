version: 2

models:
  - name: stg_fred_observations
    description: Typed, deduplicated FRED observations, one row per series/date.
    columns:
      - name: series_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["UMCSENT", "UNRATE", "GDP", "CPIAUCSL", "FEDFUNDS", "T10Y2Y"]
      - name: observation_date
        tests:
          - not_null
      - name: value
        tests:
          - not_null
